[project]
name = "academic-sync"
version = "0.1.0"
description = "Local-first pipeline that turns D2L/Brightspace course material into a structured academic obligation model, and syncs the clear subset into Google Calendar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Only needed to actually synthesize audio (`audio-lectures synthesize` in
# local mode) -- everything else in the audio_lectures package (content
# extraction, naming, manifest, script chunking, the CLI itself) imports
# fine without these. See .claude/skills/audio-lectures/docs/setup.md.
audio = [
    "torch>=2.3",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[project.scripts]
academic-sync = "academic_sync.cli:app"
audio-lectures = "audio_lectures.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_sync", "src/audio_lectures"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
