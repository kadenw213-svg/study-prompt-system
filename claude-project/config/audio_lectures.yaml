# Engineering defaults for the audio-lectures skill. Anything the user
# should change per-run belongs on the CLI (--voice, --speed, --backend),
# not here -- this file only holds the stable defaults. See
# src/audio_lectures/config.py and .claude/skills/audio-lectures/docs/setup.md.

# output_root is intentionally omitted here -- config.py defaults it to
# Desktop/Audio Lectures (DEFAULT_OUTPUT_ROOT). Uncomment to override:
# output_root: "D:/Audio Lectures"
output_format: mp3

voice:
  voice_id: am_fenrir # a Kokoro stock voice -- never a real person's cloned voice
  speed: 1.0
  lang_code: a # American English

tts:
  mode: local # "local" (this machine's GPU) or "remote" (another PC's Kokoro-FastAPI server)
  server_url: null # e.g. http://192.168.1.20:8880 when mode is "remote"

script:
  max_tts_chunk_chars: 400
  words_per_minute_estimate: 165
  min_script_words: 250
