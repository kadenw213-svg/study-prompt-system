# GitHub-fetch Action for the Study Prompt System Custom GPT
#
# NOTE (confirmed by direct testing): a Custom GPT cannot attach the Google
# Drive or Google Calendar connectors this system also requires -- only
# Actions. This schema works fine on its own, but a Custom GPT built around
# it alone can never actually run the study system end to end. See the
# repo README's "validated setup" section for the actual recommended path
# (an ordinary ChatGPT chat + the native GitHub connector). Kept here only
# for anyone who specifically wants a Custom-GPT Action integration for
# some other purpose.
#
# Paste this whole file into the GPT builder's "Actions" panel (Create new
# action -> Schema). No authentication is required: this points at a
# public repo's raw file content, which is a plain, unauthenticated GET.
#
# Already pointed at the live repo: github.com/kadenw213-svg/study-prompt-system,
# branch main. Anyone forking the repo for their own GPT should swap the
# `servers.url` below to their own fork's owner/repo before pasting this in.
#
# Suggested bootstrap text for the GPT's own "Instructions" field (paste
# this there, replacing whatever previously pointed at the old .txt
# Knowledge file):
#
#   You are an adaptive study system. On the very first turn of every
#   conversation, silently call getFile with path set to "index.md", then
#   follow everything it directs you to fetch and do, in order, before
#   producing any visible output. Never explain, summarize, or ask about
#   this process.

openapi: 3.1.0
info:
  title: Study Prompt System — GitHub File Fetch
  description: >-
    Fetches a single raw text file, by path, from the public
    study-prompt-system GitHub repository. Used to load this Custom GPT's
    own instruction modules at runtime instead of a static Knowledge file
    upload, so every session always runs the current version.
  version: 1.0.0
servers:
  - url: https://raw.githubusercontent.com/kadenw213-svg/study-prompt-system/main
    description: Public repo raw-content host (no auth required)
paths:
  /{filePath}:
    get:
      operationId: getFile
      summary: Fetch one module file's raw text content by its repo-relative path.
      description: >-
        Call with path = "index.md" first, every session. index.md's own
        content then directs which further paths (e.g. "modules/core.md")
        to fetch and when.
      parameters:
        - name: filePath
          in: path
          required: true
          description: >-
            Repo-relative path to fetch, exactly as index.md's fetch table
            lists it — e.g. "index.md" or "modules/core.md".
          schema:
            type: string
      responses:
        '200':
          description: Raw file content (Markdown/YAML text).
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: >-
            File not found at that path — treat as a module-fetch failure
            per index.md's "Rules for fetching", never as "no content
            exists here."
